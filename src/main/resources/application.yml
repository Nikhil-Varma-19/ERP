server:
  port: ${PORT}
  servlet:
    context-path: /api

spring:
  application:
    name: ERP
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: none
      show-sql: ${DB_QUERY}
    properties:
      hibernate:
        format_sql: ${DB_QUERY}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6370

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB



  jwt:
    secret-key: ${JWT_SECRET_KEY}
    refresh-time: ${JWT_REFRESH_TIME}
    exp-time: ${JWT_EXP_TIME}

dir:
  getFile: ${GET_FILE}
  uploadFile: ${UPLOAD_FILE}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
